<script>
/* ------------------ UNIT LISTS ------------------ */
const units = {
    Length: ["m","cm","km","in","ft","yd","mile"],
    Weight: ["kg","g","lb","oz"],
    Temperature: ["C","F","K"],
    Time: ["s","min","hr","day"],
    Area: ["m2","cm2","km2","acre"],
    Volume: ["L","mL","m3","cm3","gal"],
    Pressure: ["Pa","kPa","MPa","GPa","atm","bar","psi"],
    Energy: ["J","kJ","cal","kcal"],
    Speed: ["m/s","km/h","mph"]
};

/* ------------------ MENU SWITCH ------------------ */
function switchMenu() {
    const menu = document.getElementById("mainMenu");

    document.getElementById("conversionSection").style.display =
        menu.value === "conversion" ? "block" : "none";

    document.getElementById("computeSection").style.display =
        menu.value === "compute" ? "block" : "none";
}

/* ------------------ LOAD UNIT CATEGORIES ------------------ */
function loadUnitCategories() {
    const category = document.getElementById("category");
    category.innerHTML = "";

    Object.keys(units).forEach(c =>
        category.innerHTML += `<option>${c}</option>`
    );

    loadUnits();
}

/* ------------------ LOAD UNITS ------------------ */
function loadUnits() {
    const cat = document.getElementById("category").value;
    const from = document.getElementById("unitFrom");
    const to = document.getElementById("unitTo");

    from.innerHTML = "";
    to.innerHTML = "";

    units[cat].forEach(u => {
        from.innerHTML += `<option>${u}</option>`;
        to.innerHTML += `<option>${u}</option>`;
    });
}

loadUnitCategories();

/* ------------------ CONVERSION ------------------ */
function convert() {
    const val = document.getElementById("value").value;
    const categorySel = document.getElementById("category");
    const unitFromSel = document.getElementById("unitFrom");
    const unitToSel = document.getElementById("unitTo");
    const convResult = document.getElementById("convResult");

    if (val.trim() === "" || isNaN(val)) {
        convResult.innerHTML = "Enter a valid number!";
        return;
    }

    fetch("/convert", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            value: val,
            category: categorySel.value,
            unitFrom: unitFromSel.value,
            unitTo: unitToSel.value
        })
    })
    .then(r => r.json())
    .then(data => {
        convResult.innerHTML =
            `${val} ${unitFromSel.value} = <b>${data.result} ${unitToSel.value}</b>`;
    });
}

/* ------------------ COMPUTE ------------------ */
const forms = {
    "F=ma": ["Mass (kg)", "Acceleration (m/s²)"],
    "T=Fr": ["Force (N)", "Radius (m)"],
    "σ=F/A": ["Force (N)", "Area (m²)"],
    "P=Fv": ["Force (N)", "Velocity (m/s)"],
    "W=Fd": ["Force (N)", "Distance (m)"],
    "KE=1/2mv2": ["Mass (kg)", "Velocity (m/s)"],
    "PE=mgh": ["Mass (kg)", "Gravity (m/s²)", "Height (m)"],
    "a=F/m": ["Force (N)", "Mass (kg)"],
    "w=v/r": ["Velocity (m/s)", "Radius (m)"],
    "Fc=mv2/r": ["Mass (kg)", "Velocity (m/s)", "Radius (m)"]
};

function loadInputs() {
    const formula = document.getElementById("computeSelect").value;
    const inputs = document.getElementById("inputs");

    inputs.innerHTML = "<br>";

    forms[formula].forEach((label, i) => {
        inputs.innerHTML += `
            <label>${label}:</label>
            <input id="in${i}"><br>
        `;
    });
}

loadInputs();

function compute() {
    const formula = document.getElementById("computeSelect").value;
    const computeResult = document.getElementById("computeResult");

    let arr = [];
    forms[formula].forEach((_, i) => {
        arr.push(document.getElementById("in" + i).value);
    });

    fetch("/compute", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ formula: formula, values: arr })
    })
    .then(r => r.json())
    .then(data => {
        computeResult.innerHTML = `Result: <b>${data.result} ${data.unit}</b>`;
    });
}
</script>
