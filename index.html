<!DOCTYPE html>
<html>
<head>
    <title>Engineering Calculator</title>
</head>
<body>

<h1>Engineering Calculator</h1>

<h3>Unit Conversion</h3>

Category:
<select id="category">
    <option>Length</option>
    <option>Weight</option>
    <option>Time</option>
    <option>Area</option>
    <option>Volume</option>
    <option>Pressure</option>
    <option>Energy</option>
    <option>Speed</option>
    <option>Temperature</option>
</select>

<br><br>

Value:
<input type="number" id="value">

From:
<select id="fromUnit"></select>

To:
<select id="toUnit"></select>

<br><br>

<button onclick="convert()">Convert</button>

<h3 id="result"></h3>

<script>
// ------------------------------------
// UNITS FOR DROPDOWN MENU
// ------------------------------------
const units = {
    "Length": ["m", "cm", "km", "in", "ft", "yd", "mile"],
    "Weight": ["kg", "g", "lb", "oz"],
    "Time": ["s", "min", "hr", "day"],
    "Area": ["m2", "cm2", "km2", "acre"],
    "Volume": ["L", "mL", "m3", "cm3", "gal"],
    "Pressure": ["Pa", "kPa", "MPa", "GPa", "atm", "bar", "psi"],
    "Energy": ["J", "kJ", "cal", "kcal"],
    "Speed": ["m/s", "km/h", "mph"],
    "Temperature": ["C", "F", "K"]
};

// Populate dropdowns when category changes
document.getElementById("category").addEventListener("change", function () {
    fillUnits(this.value);
});

function fillUnits(cat) {
    let from = document.getElementById("fromUnit");
    let to = document.getElementById("toUnit");

    from.innerHTML = "";
    to.innerHTML = "";

    units[cat].forEach(u => {
        from.innerHTML += `<option>${u}</option>`;
        to.innerHTML += `<option>${u}</option>`;
    });
}

fillUnits("Length");

// ------------------------------------
// SEND DATA TO FLASK /convert
// ------------------------------------
function convert() {
    fetch("/convert", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            value: document.getElementById("value").value,
            category: document.getElementById("category").value,
            unitFrom: document.getElementById("fromUnit").value,
            unitTo: document.getElementById("toUnit").value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerHTML =
            "Result: " + data.result;
    });
}
</script>

</body>
</html>
